[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromorphic-nwlamas"
version = "0.1.0"
description = "Neuromorphic nanowire network simulator for stochastic generation, topology modeling, and electrical/dynamic simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "QILPCM-IFLP-CONICET" }
]
keywords = [
    "neuromorphic", "nanowires", "network-simulation",
    "memristors", "electrical-simulation", "stochastic-modeling",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.0",
    "types-networkx",
    "scipy-stubs",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.0",          # tema moderno, alternativa a sphinx_rtd_theme
    "sphinx-autobuild>=2024.0",  # preview con recarga en vivo
    "sphinx-copybutton",
    "sphinx-design",
]
numba = [
    "numba>=0.59",
]


[project.urls]
Homepage = "https://github.com/QILPCM-IFLP-CONICET/neuromorphicNWLamas"
Repository = "https://github.com/QILPCM-IFLP-CONICET/neuromorphicNWLamas"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuromorphic = ["*.ini", "py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning",
    # Esperable en tests genéricos que corren 'thermal' con dt grande
    "ignore::neuromorphic.fisica.evolvers.thermal.StepSaturationWarning",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["neuromorphic"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Physics-domain identifiers (V, I, G, Y, R, ...) follow scientific
    # notation and are intentional. Revisit in the naming-cleanup pass.
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]