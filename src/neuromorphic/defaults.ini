[Network]
num_wires = 2000
area = 1000.0
length = 70.0
proximity_threshold_ratio = 0.05

[Electrical]
g_leak = 1e-18
v_input = 3.6
v_ground = 0.0
# Voltaje de lectura bajo para la fase de relajación (Fig 2b)
v_read = 0.05
# Parámetros físicos para calcular R exactamente
rho_plata = 0.0159
diametro_nm = 115.0

[Time]
total_time = 0.5
time_step_dt = 1e-3
# Experimento de pulso y relajación (Fig 2b)
t_pulse = 10.0
t_relax = 40.0

[Memristor]
g_on = 1e-3
g_off = 1e-9
v_threshold = 0.01
evolver_model = stochastic1

[Probabilities]
p0_set = 0.4
alpha_set = 1.0
p_decay = 0.8
beta_reset = 1.0
seed = 42